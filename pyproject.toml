[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-geometry"
version = "0.1.0"
description = "Reproducible experiments on frozen visual feature statistics"
requires-python = ">=3.12,<3.13"
# Pinned to the LUMI LAIF container lumi-multitorch-full-u24r70f21m50t210-20260731_122833 (Python 3.12.3; torch is
# its ROCm 7.0 build there, the CPU build locally).
dependencies = ["numpy==2.3.5", "scipy==1.18.0", "scikit-learn==1.9.0", "matplotlib==3.11.1", "torch==2.10.0", "pytorch-lightning==2.6.5",
                "h5py==3.16.0", "pandas==2.3.3", "pyarrow==25.0.0", "pillow==12.2.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
